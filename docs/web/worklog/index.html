<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工作复盘助手 · 08's Portfolio</title>
  <style>
    :root{--bg:#f7f7f4;--paper:#fffefd;--ink:#22272e;--muted:#6d7782;--line:#e3e6e7;--blue:#315b7d;--blue-soft:#eef4f8;--green:#478069;--amber:#b37935;--radius:12px;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}button,input,textarea{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}
    .app{min-height:100vh;display:grid;grid-template-columns:246px minmax(0,1fr)}.side{height:100vh;position:sticky;top:0;display:flex;flex-direction:column;padding:20px 14px;border-right:1px solid var(--line);background:#fbfbf9}.brand{display:flex;align-items:center;gap:9px;padding:3px 8px 16px;font-weight:780;letter-spacing:-.025em}.brand-mark{width:29px;height:29px;display:grid;place-items:center;border-radius:8px;background:#273d50;color:#fff;font-size:15px}.demo{margin:0 8px 16px;color:#8b949d;font-size:10px;font-weight:800;letter-spacing:.1em}.new{width:100%;padding:9px 10px;background:#fff;border:1px solid #cbd7e0;border-radius:8px;color:var(--blue);font-weight:700;text-align:left}.nav{display:grid;gap:2px;margin-top:18px}.nav-label{padding:10px 8px 3px;color:#8a939d;font-size:10px;font-weight:800;letter-spacing:.1em}.nav button{border:0;padding:8px;background:transparent;border-radius:7px;color:#586472;text-align:left}.nav button:hover,.nav button.on{background:var(--blue-soft);color:#274d6b}.count{float:right;color:#8e99a3;font-size:11px}.project{padding:8px;border-radius:8px}.project.on{background:#f1f4f5}.project b{display:block;font-size:12px}.project span{font-size:11px;color:var(--muted)}.memory{margin-top:auto;padding:13px;border:1px solid var(--line);border-radius:10px;background:#fff}.memory h3{margin:0 0 11px;color:#75808b;font-size:10px;letter-spacing:.11em}.memory-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.memory b{display:block;font-size:17px}.memory span{color:var(--muted);font-size:10px}
    .main{width:min(100%,1100px);margin:0 auto;padding:32px 42px 80px}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:18px}.eyebrow,.mode-kicker{color:#7e8a95;font-size:10px;font-weight:800;letter-spacing:.11em}.top h1{margin:8px 0 5px;font-size:30px;letter-spacing:-.055em}.top p{margin:0;color:var(--muted)}.back{padding:8px 11px;border:1px solid var(--line);border-radius:99px;background:#fff;font-size:12px;white-space:nowrap}.tabs{display:flex;gap:4px;margin:30px 0 23px;border-bottom:1px solid var(--line)}.tab{position:relative;padding:11px 14px 12px;border:0;background:transparent;color:#78838d;font-weight:700}.tab.on{color:#294f70}.tab.on:after{position:absolute;right:14px;bottom:-1px;left:14px;height:2px;background:#426e96;content:""}
    .panel{border:1px solid var(--line);border-radius:var(--radius);background:var(--paper)}.composer{width:min(100%,790px);padding:29px}.composer h2{margin:7px 0 22px;font-size:24px;letter-spacing:-.045em}.input-title{margin-bottom:8px;font-size:12px;font-weight:750}.note{display:block;width:100%;min-height:238px;padding:16px;border:1px solid #d8dde1;border-radius:9px;outline:0;background:#fdfdfb;color:var(--ink);line-height:1.7;resize:vertical}.note:focus{border-color:#7f9db7;box-shadow:0 0 0 3px var(--blue-soft);background:#fff}.composer-foot{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:11px}.promise{color:#7b8791;font-size:11px}.primary,.secondary{border-radius:8px;padding:10px 14px;font-weight:750}.primary{border:0;background:#294f72;color:#fff}.primary:hover{background:#1f405d}.secondary{border:1px solid #cbd6dd;background:#fff;color:#42627c}.microflow{display:flex;align-items:center;gap:9px;margin:14px 0 0;color:#8b959d;font-size:11px}.microflow i{height:1px;width:18px;background:#d7dde1}
    .follow{width:min(100%,790px);padding:26px}.follow-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.follow h2{margin:6px 0;font-size:22px;letter-spacing:-.04em}.stage{padding:5px 8px;border-radius:99px;background:var(--blue-soft);color:#416784;font-size:11px;font-weight:800}.known{margin:20px 0;padding:14px;border-radius:9px;background:#f7fafb}.known-title{margin-bottom:7px;color:#65737f;font-size:10px;font-weight:800;letter-spacing:.1em}.known div{margin:4px 0;color:#3d565d;font-size:12px}.known div:before{margin-right:7px;color:var(--green);content:"✓"}.question{padding:18px;border:1px solid var(--line);border-radius:10px}.question h3{margin:5px 0 12px;font-size:17px;letter-spacing:-.02em}.question textarea{display:block;width:100%;min-height:76px;padding:10px;border:1px solid #d7dfe4;border-radius:7px;outline:0;resize:vertical}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}.chip{padding:6px 10px;border:1px solid #d6e0e7;border-radius:99px;background:#fff;color:#50687c;font-size:11px}.why{margin-top:11px;color:#687783;font-size:11px}.why summary{cursor:pointer;display:inline;color:#55728a}.follow-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:16px}
    .weekly,.project-page{width:min(100%,900px);padding:26px}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px}.page-head h2{margin:5px 0;font-size:23px;letter-spacing:-.04em}.page-head p{margin:0;color:var(--muted)}.week-stats{display:flex;gap:24px;margin:22px 0 16px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.week-stats b{display:block;font-size:19px}.week-stats span{color:var(--muted);font-size:11px}.group{margin-top:18px}.group h3{margin:0 0 6px;font-size:12px}.check-row{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid #edf0f1;color:#39434b;font-size:12px}.check-row input{accent-color:#426d92}.check-row span{margin-left:auto;color:#84909a;font-size:11px}.suggestion{margin-top:19px;padding:13px 14px;border-left:3px solid #6a8ca7;border-radius:0 8px 8px 0;background:#f5f8fa;color:#51616d;font-size:12px}.suggestion b{color:#365c79}.project-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.project-head h2{margin:5px 0;font-size:23px;letter-spacing:-.04em}.project-head p{margin:0;color:var(--muted);font-size:12px}.health{width:250px;padding:13px;border:1px solid var(--line);border-radius:9px;background:#fcfcfa}.health-top{display:flex;justify-content:space-between;font-size:11px;font-weight:750}.bar{height:7px;overflow:hidden;margin:9px 0;border-radius:99px;background:#e8edef}.bar i{display:block;width:76%;height:100%;border-radius:inherit;background:#5d829e}.health small{color:var(--muted);font-size:10px}.health-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:22px 0}.health-item{padding:11px;border:1px solid var(--line);border-radius:8px;font-size:12px}.health-item.ok:before{margin-right:6px;color:var(--green);content:"✓"}.health-item.todo:before{margin-right:6px;color:var(--amber);content:"△"}.project-actions{display:flex;gap:9px;margin-top:18px}
    .result{width:min(100%,790px);padding:26px}.result-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.result h2{margin:5px 0;font-size:22px}.date{color:#84909a;font-size:11px}.blocks{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.block{min-height:115px;padding:13px;border:1px solid var(--line);border-radius:9px}.block label{color:#74818d;font-size:10px;font-weight:850;letter-spacing:.1em}.block p{margin:8px 0 0;font-size:12px;line-height:1.65}.block.warn{border-left:3px solid #c28a48}.block.next{border-left:3px solid #668d7a}.savebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}.savebar span{margin-right:auto;color:var(--muted);font-size:12px}.saved{width:100%;margin:0 0 4px;color:var(--green);font-size:12px;font-weight:700}.toast{position:fixed;right:20px;bottom:20px;padding:10px 13px;border-radius:8px;background:#273a4c;color:#fff;font-size:12px;opacity:0;pointer-events:none;transform:translateY(8px);transition:.2s}.toast.show{opacity:1;transform:none}
    @media(max-width:800px){.app{display:block}.side{display:none}.main{padding:24px 16px 56px}.top h1{font-size:27px}.tabs{overflow:auto}.tab{white-space:nowrap}.composer,.follow,.weekly,.project-page,.result{padding:20px}.composer h2{font-size:22px}.blocks,.health-list{grid-template-columns:1fr}.project-head,.page-head{display:block}.health{width:100%;margin-top:16px}.page-head .primary{margin-top:14px}.composer-foot{align-items:flex-end;flex-direction:column}.promise{align-self:flex-start}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand"><span class="brand-mark">↻</span>工作复盘助手</div>
      <div class="demo">DEMO WORKSPACE</div>
      <button class="new" onclick="openMode('daily')">＋ 新建复盘</button>
      <nav class="nav">
        <div class="nav-label">工作记录</div>
        <button class="on" onclick="openMode('daily')">今天 <span class="count" id="todayCount">3</span></button>
        <button onclick="openMode('weekly')">本周 <span class="count" id="weekCount">11</span></button>
        <div class="nav-label">项目</div>
        <div class="project on"><b>地点合集 GTM</b><span><span id="projectCount">6</span> 条工作记录</span></div>
        <div class="project"><b>世界杯 Agent</b><span>9 条工作记录</span></div>
        <div class="project"><b>AI Web 探索</b><span>3 条工作记录</span></div>
        <div class="nav-label">沉淀</div>
        <button>面试素材 <span class="count" id="interviewCount">5</span></button>
      </nav>
      <section class="memory">
        <h3>WORK MEMORY</h3>
        <div class="memory-grid">
          <div><b id="memWeek">11</b><span>本周记录</span></div>
          <div><b>3</b><span>活跃项目</span></div>
          <div><b id="memFollow">4</b><span>待跟进</span></div>
          <div><b id="memMissing">2</b><span>待补充</span></div>
        </div>
      </section>
    </aside>
    <main class="main">
      <header class="top">
        <div><div class="eyebrow">WORK REVIEW ASSISTANT</div><h1>工作复盘助手</h1><p>把零散工作记录，沉淀成可复用的项目经验</p></div>
        <a class="back" href="/08/works/#tools">← 返回作品集</a>
      </header>
      <nav class="tabs">
        <button class="tab" data-mode="meeting">记录整理</button>
        <button class="tab on" data-mode="daily">每日复盘</button>
        <button class="tab" data-mode="weekly">周报生成</button>
        <button class="tab" data-mode="project">项目复盘</button>
      </nav>
      <div id="workspace"></div>
    </main>
  </div>
  <div class="toast" id="toast"></div>
  <script>
    const SAMPLE=[
      {id:1,project:'地点合集 GTM',title:'完成 KOS 三类场景测试',input:'完成地点合集 KOS 测试，追星场景表现最好；与产品确认下一版需求。',selected:true,mode:'daily',dest:'project'},
      {id:2,project:'地点合集 GTM',title:'确定 KOC 扩散方案',input:'梳理 KOC 试点方案和样本补充节奏。',selected:true,mode:'daily',dest:'project'},
      {id:3,project:'地点合集 GTM',title:'补齐测试数据口径',input:'与数据同学确认 CTR、使用率的统计口径。',selected:false,mode:'meeting',dest:'today'},
      {id:4,project:'地点合集 GTM',title:'完成落地页问题梳理',input:'汇总首批反馈并排定改版优先级。',selected:false,mode:'daily',dest:'project'},
      {id:5,project:'地点合集 GTM',title:'确认下轮实验方向',input:'确定新增 KOC 样本和对照场景。',selected:true,mode:'daily',dest:'project'},
      {id:6,project:'地点合集 GTM',title:'输出阶段测试结论',input:'沉淀场景匹配度和后续验证假设。',selected:false,mode:'weekly',dest:'project'},
      {id:7,project:'AI Web 探索',title:'完成 Prompt 稳定性测试',input:'完成多轮 Prompt 输出稳定性测试。',selected:true,mode:'daily',dest:'today'},
      {id:8,project:'AI Web 探索',title:'调整页面 copy',input:'根据使用反馈调整引导文案。',selected:false,mode:'daily',dest:'today'},
      {id:9,project:'世界杯 Agent',title:'整理赛事节点素材',input:'完成赛事内容节点整理。',selected:false,mode:'meeting',dest:'today'},
      {id:10,project:'世界杯 Agent',title:'确认推荐策略',input:'确认第一版推荐策略。',selected:false,mode:'daily',dest:'interview'},
      {id:11,project:'世界杯 Agent',title:'复盘首轮用户反馈',input:'沉淀首轮用户反馈与风险。',selected:false,mode:'weekly',dest:'interview'}
    ];
    const MODES={
      meeting:{key:'RECORD ORGANIZER',title:'把一段杂乱信息，拆成行动项',placeholder:'粘贴会议记录、聊天记录或语音转写……',promise:'输出结论、Todo、负责人和截止时间。'},
      daily:{key:'DAILY REVIEW',title:'今天发生了什么？',placeholder:'粘贴今天的 Todo、聊天、会议记录或零散想法……',promise:'AI 会先补问缺失信息，不会替你编造结果。'},
      weekly:{key:'WEEKLY REVIEW',title:'这一周有哪些值得汇报？',placeholder:'补充本周还未记录的结果、风险或下周重点……',promise:'从已沉淀记录中选择重点，再生成周报。'},
      project:{key:'PROJECT REVIEW',title:'这个项目到底做成了什么？',placeholder:'补充项目背景、关键动作、结果或反思……',promise:'只补全缺失信息，再沉淀为项目表达。'}
    };
    const STORE='work_review_demo_v4';
    let mode='daily',answers=[],questions=[],qIndex=0,sourceInput='',savedDest='';
    const $=id=>document.getElementById(id);
    function records(){try{const x=JSON.parse(localStorage.getItem(STORE));return Array.isArray(x)&&x.length?x:SAMPLE}catch{return SAMPLE}}
    function persist(x){localStorage.setItem(STORE,JSON.stringify(x));updateMemory()}
    function esc(x){return String(x||'').replace(/[&<>]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[s]))}
    function toast(x){const e=$('toast');e.textContent=x;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
    function updateMemory(){const r=records(),project=r.filter(x=>x.project==='地点合集 GTM').length;$('todayCount').textContent=3;$('weekCount').textContent=r.length;$('projectCount').textContent=project;$('interviewCount').textContent=Math.max(5,r.filter(x=>x.dest==='interview').length);$('memWeek').textContent=r.length;$('memFollow').textContent=4;$('memMissing').textContent=2}
    function tabState(){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.mode===mode))}
    function openMode(next){mode=next;answers=[];questions=[];qIndex=0;savedDest='';tabState();if(mode==='weekly')renderWeekly();else if(mode==='project')renderProject();else renderComposer()}
    function renderComposer(prefill=''){const m=MODES[mode];$('workspace').innerHTML='<section class="panel composer"><div class="mode-kicker">'+m.key+'</div><h2>'+m.title+'</h2><div class="input-title">工作记录</div><textarea class="note" id="workInput" placeholder="'+m.placeholder+'">'+esc(prefill)+'</textarea><div class="composer-foot"><span class="promise">'+m.promise+'</span><button class="primary" onclick="startReview()">开始复盘 →</button></div><div class="microflow"><span>识别信息</span><i></i><span>补充缺口</span><i></i><span>生成复盘</span><i></i><span>沉淀到项目</span></div></section>'}
    function knownFrom(text){const items=[];if(/KOS|测试/.test(text))items.push('完成 KOS 场景测试');if(/追星/.test(text))items.push('追星场景表现更好');if(/需求|产品/.test(text))items.push('已对齐下一版需求');if(!items.length)items.push('已识别到一条新的工作记录');return items.slice(0,3)}
    function getQuestions(text){const metric=/\d+(\.\d+)?\s*(%|次|人|天|小时)/.test(text),owner=/(我|本人|负责|完成|推进|设计|分析|整理)/.test(text),next=/(明天|下周|下一步|准备|优先)/.test(text),goal=/(目标|问题|为了|验证|提升|降低)/.test(text);const q=[];if(mode==='project'&&!goal)q.push({t:'这项工作主要想解决什么问题？',p:'输入这次项目最初要验证或改善的事情。',why:'项目目标能帮助后续判断：你的动作和结果是否真正对准了问题。'});if(!metric&&mode!=='meeting')q.push({t:'“表现更好”具体对应什么？',p:'例如 CTR、使用率、转化率，或“待核实”。',why:'用于区分感知上的效果不错与可验证的项目结果；之后生成周报或面试素材时会保留这个口径。',chips:['CTR','功能使用率','转化率','待核实']});if(!owner)q.push({t:'你本人具体负责了哪些部分？',p:'例如测试场景设计、数据整理或跨团队推进。',why:'这样能清楚区分团队结果和你的个人贡献。'});if((mode==='daily'||mode==='weekly')&&!next)q.push({t:'接下来最优先推进什么？',p:'写下 1—2 个下一步行动。',why:'让复盘变成下一步行动，而不只是一次性总结。'});if(mode==='meeting')q.push({t:'是否有明确的负责人和截止时间？',p:'没有就写“待定”。',why:'这会决定行动项是否可以真正落地。'});return q.slice(0,3)}
    function startReview(){const input=$('workInput').value.trim();if(!input){toast('先写下一条工作记录吧');return}sourceInput=input;questions=getQuestions(input);answers=[];qIndex=0;if(!questions.length){renderResult();return}renderFollowup()}
    function renderFollowup(){const q=questions[qIndex],known=knownFrom(sourceInput);$('workspace').innerHTML='<section class="panel follow"><div class="follow-head"><div><div class="mode-kicker">AI FOLLOW-UP</div><h2>我已经理解了这条记录</h2></div><span class="stage">'+(qIndex+1)+' / '+questions.length+'</span></div><div class="known"><div class="known-title">已提取出</div>'+known.map(x=>'<div>'+x+'</div>').join('')+'</div><div class="question"><div class="mode-kicker">还缺一个关键信息</div><h3>'+q.t+'</h3>'+(q.chips?'<div class="chips">'+q.chips.map(x=>'<button class="chip" onclick=\'fillChip('+JSON.stringify(x)+')\'>'+x+'</button>').join('')+'</div>':'')+'<textarea id="answerInput" placeholder="'+q.p+'"></textarea><details class="why"><summary>为什么问这个？</summary><div>'+q.why+'</div></details></div><div class="follow-actions"><button class="secondary" onclick="skipQuestion()">跳过</button><button class="primary" onclick="nextQuestion()">'+(qIndex===questions.length-1?'生成复盘 →':'继续 →')+'</button></div></section>'}
    function fillChip(x){$('answerInput').value=x}
    function nextQuestion(){answers[qIndex]=$('answerInput').value.trim()||'待补充';qIndex++;if(qIndex<questions.length)renderFollowup();else renderResult()}
    function skipQuestion(){answers[qIndex]='待补充';qIndex++;if(qIndex<questions.length)renderFollowup();else renderResult()}
    function blocks(){const detail=answers.filter(x=>x&&x!=='待补充').join('；')||'待补充；已保留为待核实信息';if(mode==='meeting')return [['结论',sourceInput,''],['行动项','从记录中拆出待办；负责人或截止时间缺失时保持待定。','next'],['待确认',detail,'warn'],['下一步','补齐负责人和时间节点后同步行动项。','next']];if(mode==='weekly')return [['本周成果',sourceInput,''],['数据与证据',detail,''],['风险',answers.includes('待补充')?'仍有结果口径或归因待补充。':'已记录的风险与依赖需要持续跟进。','warn'],['下周计划','聚焦最值得向上汇报的 1—2 项工作。','next']];if(mode==='project')return [['项目目标',sourceInput,''],['关键动作',detail,''],['结果与证据',answers.includes('待补充')?'结果数据或归因仍待补充，不把它写成既定结论。':'已整理为可验证结果与证据。','warn'],['复盘反思','保留这次调整与下一轮优先验证的假设。','next']];return [['进展',sourceInput,''],['关键判断',detail,''],['阻碍',answers.includes('待补充')?'缺少结果口径或依赖信息，已标记待补充。':'当前阻碍已记录，后续需持续跟进。','warn'],['明日重点','将下一步拆成一到两个可执行动作。','next']]}
    function renderResult(){const date=new Date().toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit'}),b=blocks();$('workspace').innerHTML='<section class="panel result"><div class="result-head"><div><div class="mode-kicker">'+MODES[mode].key+'</div><h2>复盘完成</h2></div><span class="date">'+date+'</span></div><div class="blocks">'+b.map(x=>'<div class="block '+x[2]+'"><label>'+x[0].toUpperCase()+'</label><p>'+esc(x[1])+'</p></div>').join('')+'</div><div class="savebar">'+(savedDest?'<div class="saved">✓ 已'+savedDest+'，可在左侧工作资产库继续使用。</div>':'')+'<span>将这条复盘沉淀到哪里？</span><button class="secondary" onclick="saveRecord(\'保存到今天\')">保存到今天</button><button class="secondary" onclick="saveRecord(\'加入「地点合集 GTM」\')">加入项目</button><button class="primary" onclick="saveRecord(\'沉淀为面试素材\')">沉淀为面试素材</button></div></section>'}
    function saveRecord(destination){const r=records();r.unshift({id:Date.now(),project:destination.includes('项目')?'地点合集 GTM':'日常协作',title:'新建工作复盘',input:sourceInput,selected:true,mode,dest:destination.includes('项目')?'project':destination.includes('面试')?'interview':'today'});persist(r);savedDest=destination;renderResult();toast('已保存到工作资产库')}
    function renderWeekly(){const r=records();const groups=['地点合集 GTM','AI Web 探索'];$('workspace').innerHTML='<section class="panel weekly"><div class="page-head"><div><div class="mode-kicker">WEEKLY REVIEW</div><h2>08.05 — 08.11</h2><p>选择本周真正值得汇报的内容。</p></div><button class="primary" onclick="makeWeekly()">生成周报 →</button></div><div class="week-stats"><div><b>'+r.length+'</b><span>本周记录</span></div><div><b>3</b><span>涉及项目</span></div><div><b>4</b><span>待跟进事项</span></div></div>'+groups.map(g=>'<div class="group"><h3>'+g+'</h3>'+r.filter(x=>x.project===g).slice(0,4).map((x,i)=>'<label class="check-row"><input type="checkbox" class="week-choice" data-id="'+x.id+'" '+(x.selected?'checked':'')+'><span style="margin:0;color:#39434b;font-size:12px">'+esc(x.title)+'</span><span>'+x.mode.toUpperCase()+'</span></label>').join('')+'</div>').join('')+'<div class="suggestion"><b>AI 建议：</b>优先强调「场景测试结果」，因为它同时包含动作、结果与后续决策。</div></section>'}
    function makeWeekly(){const checked=[...document.querySelectorAll('.week-choice:checked')].map(x=>records().find(r=>String(r.id)===x.dataset.id)).filter(Boolean);mode='weekly';tabState();renderComposer(checked.map(x=>x.title+'：'+x.input).join('\\n'))}
    function renderProject(){const r=records().filter(x=>x.project==='地点合集 GTM');$('workspace').innerHTML='<section class="panel project-page"><div class="project-head"><div><div class="mode-kicker">PROJECT MEMORY</div><h2>地点合集 GTM</h2><p>2026.06 — 2026.08 · '+r.length+' 条工作记录</p></div><div class="health"><div class="health-top"><span>项目信息完整度</span><span>76%</span></div><div class="bar"><i></i></div><small>还需要补充个人贡献与结果归因。</small></div></div><div class="health-list"><div class="health-item ok">项目背景</div><div class="health-item ok">核心动作</div><div class="health-item ok">结果数据</div><div class="health-item todo">个人贡献</div><div class="health-item todo">结果归因</div></div><div class="suggestion"><b>下一步：</b>补全两处缺口后，即可生成适用于汇报或面试的完整项目复盘。</div><div class="project-actions"><button class="secondary" onclick="projectCompose()">补全信息</button><button class="primary" onclick="projectCompose()">生成项目复盘 →</button></div></section>'}
    function projectCompose(){const text=records().filter(x=>x.project==='地点合集 GTM').map(x=>x.title+'：'+x.input).join('\\n');renderComposer(text)}
    document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>openMode(x.dataset.mode));updateMemory();openMode('daily');
  </script>
</body>
</html>
